name: CI

on:
  push:
    branches: [main, "release-candidate/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run release:check
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
